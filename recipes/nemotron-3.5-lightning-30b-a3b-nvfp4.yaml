# Challenger: Nemotron 3.5 Lightning 30B-A3B NVFP4. Same shape as the incumbent (30B total,
# 3B active), newer than Nemotron-3-Nano (repo updated 2026-09-10), and its parsers are
# built into vLLM, so nothing is loaded from the model repo.
# Flags are taken from eugr/spark-vllm-docker recipes/nemotron-3.5-lightning.yaml, which is
# a v1 recipe for eugr's own launcher. Ported to sparkrun v2 here, not yet run.
# The mamba flags are copied as a set from that recipe. --mamba-cache-mode align is what
# makes prefix caching work on the Mamba layers, so check the prefix-cache probe in perf.
# Drafter is a second HF repo (1.3 GiB), pinned inside speculative_config.
recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
model_revision: bee7596271d1495f6992ae224aefde4410e816b8
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:20260918@sha256:1b0be62c1ccb37f738746cd8fbcec73b46f0c283082a6d46aebf9f19b5747563
max_nodes: 1

metadata:
  description: Nemotron 3.5 Lightning 30B-A3B NVFP4 with the DSpark drafter, eugr nightly 2026-09-18.
  maintainer: blaine
  category: agent
  model_dtype: nvfp4
  kv_dtype: fp8

defaults:
  port: 8001
  host: 0.0.0.0
  served_model_name: nemotron-3.5-lightning-30b-a3b
  tensor_parallel: 1
  gpu_memory_utilization: 0.40        # lab slot. Exclusive mode: -o gpu_memory_utilization=0.80
  max_model_len: 131072               # model supports 1M. Held at 128K to match the other candidates.
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  moe_backend: marlin
  load_format: instanttensor
  mamba_backend: flashinfer
  mamba_ssm_cache_dtype: float16
  mamba_cache_mode: align
  mamba_cache_philox_rounds: 5
  tool_call_parser: qwen3_xml
  reasoning_parser: nemotron_v3       # built into the image. No plugin file, unlike Nemotron-3-Nano.
  speculative_config: '{"method":"dspark","model":"nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark","revision":"8a0177116d138011e63103110f136ec0ca09ebbf","num_speculative_tokens":7}'

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --moe-backend {moe_backend} \
    --load-format {load_format} \
    --mamba-backend {mamba_backend} \
    --mamba-ssm-cache-dtype {mamba_ssm_cache_dtype} \
    --mamba-cache-mode {mamba_cache_mode} \
    --enable-mamba-cache-stochastic-rounding \
    --mamba-cache-philox-rounds {mamba_cache_philox_rounds} \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --speculative-config '{speculative_config}' \
    --trust-remote-code
