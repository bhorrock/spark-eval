# Incumbent. Flags follow the official qwen3.6-35b-a3b-fp8-mtp-vllm recipe, with the
# NVFP4 checkpoint and a 128K window. Replace every CHANGEME before the first run.
#
# The official FP8 recipe also applies two mods (fix-qwen3-coder-next,
# fix-qwen3.5-chat-template) and passes --chat-template unsloth.jinja. They live in
# the official registry. If your working setup depends on them, copy them into this
# repo and add `mods:` and the flag. The smoke and tools gates will tell you.
recipe_version: "2"
model: CHANGEME/Qwen3.6-35B-A3B-NVFP4
model_revision: CHANGEME-hf-commit-sha
runtime: vllm
container: CHANGEME/vllm-image@sha256:CHANGEME
max_nodes: 1

metadata:
  description: Qwen3.6 35B-A3B NVFP4, MTP on. Daily driver and baseline.
  maintainer: blaine
  category: agent
  model_dtype: nvfp4
  kv_dtype: fp8

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: qwen3.6-35b-a3b
  tensor_parallel: 1
  gpu_memory_utilization: 0.45        # driver slot. See README for the slot overrides.
  max_model_len: 131072
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  num_speculative_tokens: 2

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

executor_config:
  restart_policy: unless-stopped

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}' \
    --trust-remote-code
