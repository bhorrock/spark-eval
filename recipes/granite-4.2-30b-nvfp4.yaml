# Candidate. Its tool parser is not in vLLM yet. The model repo ships one as a Python
# file, and vLLM loads it with --tool-parser-plugin. The command asks huggingface_hub
# where that file sits in the mounted cache, so the recipe does not depend on the
# cache's folder layout. The container runs offline, so the lookup only succeeds if
# sparkrun already downloaded the file at the pinned revision.
#
# The plugin is code from the model repo running inside the server. The SHA pin is
# what stops it changing under you.
#
# Other CHANGEMEs: whatever the hybrid Mamba layers need on your vLLM build, and a
# reasoning parser if the model has one. Then run `sparkrun recipe validate`.
recipe_version: "2"
model: CHANGEME/granite-4.2-30b-NVFP4
model_revision: CHANGEME-hf-commit-sha
runtime: vllm
container: CHANGEME/vllm-image@sha256:CHANGEME
max_nodes: 1

metadata:
  description: Granite 4.2 30B NVFP4. Challenger to the Qwen3.6 daily driver.
  maintainer: blaine
  category: agent
  model_dtype: nvfp4
  kv_dtype: fp8

defaults:
  port: 8001                          # lab slot by default, so it never collides with the driver
  host: 0.0.0.0
  served_model_name: granite-4.2-30b
  tensor_parallel: 1
  gpu_memory_utilization: 0.40
  max_model_len: 131072
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  tool_call_parser: CHANGEME                      # the name the plugin registers, not a file name
  tool_parser_file: CHANGEME.py                   # path of the plugin inside the model repo

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-parser-plugin "$(python3 -c 'import sys, huggingface_hub as h; print(h.hf_hub_download(sys.argv[1], sys.argv[2], revision=sys.argv[3]))' {model} {tool_parser_file} {model_revision})" \
    --tool-call-parser {tool_call_parser} \
    --trust-remote-code
