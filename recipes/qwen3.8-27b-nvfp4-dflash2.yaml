# Qwen3.8-27B NVFP4 with an external draft model instead of MTP.
# Speculation settings from eugr/spark-vllm-docker recipes/qwen3.8-27b-nvfp4-dflash2.yaml.
# The drafter is a second HF repo (3.6 GiB). sparkrun reads model + revision out of
# speculative_config to download it; vLLM reads the same revision to find it offline.
# Drafter weights and its KV come out of the same utilization budget.
recipe_version: "2"
model: nvidia/Qwen3.8-27B-NVFP4
model_revision: 482ca0f3832238542f8f5295dde86b5f22711d80
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:20260918@sha256:1b0be62c1ccb37f738746cd8fbcec73b46f0c283082a6d46aebf9f19b5747563
max_nodes: 1

metadata:
  description: Qwen3.8-27B NVFP4 (dense hybrid) with the z-lab DFlash2 drafter.
  maintainer: blaine
  category: agent
  model_dtype: nvfp4
  kv_dtype: fp8

defaults:
  port: 8001
  host: 0.0.0.0
  served_model_name: qwen3.8-27b
  tensor_parallel: 1
  gpu_memory_utilization: 0.40        # lab slot. Exclusive mode: -o gpu_memory_utilization=0.80
  max_model_len: 131072
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  load_format: instanttensor          # both upstream recipes use it on this image. Fallback: -o load_format=auto
  mm_encoder_tp_mode: data
  tool_call_parser: qwen3_coder       # NVIDIA's card and the official recipe. eugr's recipe uses qwen3_xml.
  reasoning_parser: qwen3
  speculative_config: '{"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","revision":"50307d4c4cde6860d4eee73e2547cd786fe8e8a4","num_speculative_tokens":8,"draft_tensor_parallel_size":1}'

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --attention-backend {attention_backend} \
    --load-format {load_format} \
    --mm-encoder-tp-mode {mm_encoder_tp_mode} \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --speculative-config '{speculative_config}' \
    --trust-remote-code
