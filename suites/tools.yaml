# Gate 3. Tool calling, run at several context lengths. The number that matters
# is malformed_rate per context: calls that break the protocol, as opposed to
# calls that are well formed but wrong.
defaults: {temperature: 0, max_tokens: 2048}

tools:
  run_suiteql:
    description: Run a read-only SuiteQL query against NetSuite and return rows.
    parameters:
      type: object
      properties:
        query: {type: string, description: SuiteQL text}
        limit: {type: integer, minimum: 1, maximum: 5000}
      required: [query]
      additionalProperties: false
  get_record:
    description: Load one NetSuite record by type and internal id.
    parameters:
      type: object
      properties:
        record_type: {type: string, enum: [salesorder, customer, vendorbill, item, invoice]}
        id: {type: integer}
      required: [record_type, id]
      additionalProperties: false
  search_jira:
    description: Search Jira issues with JQL.
    parameters:
      type: object
      properties:
        jql: {type: string}
        max_results: {type: integer, minimum: 1, maximum: 100}
      required: [jql]
      additionalProperties: false
  create_jira_issue:
    description: Create a Jira issue.
    parameters:
      type: object
      properties:
        project: {type: string}
        issue_type: {type: string, enum: [Story, Task, Bug]}
        summary: {type: string}
        description: {type: string}
        labels: {type: array, items: {type: string}}
        estimate: {type: object, properties: {value: {type: number}, unit: {type: string, enum: [h, d]}}, required: [value, unit]}
      required: [project, issue_type, summary]
      additionalProperties: false
  read_file:
    description: Read a file from the workspace.
    parameters:
      type: object
      properties: {path: {type: string}}
      required: [path]
      additionalProperties: false
  write_file:
    description: Write text to a file in the workspace, replacing it.
    parameters:
      type: object
      properties: {path: {type: string}, content: {type: string}}
      required: [path, content]
      additionalProperties: false

cases:
  - id: pick_right_tool
    tools: [run_suiteql, get_record, search_jira, read_file]
    messages: [{role: user, content: "Open invoice 88120."}]
    expect: {tool_call: {name: get_record, args: {record_type: invoice, id: 88120}}}

  - id: enum_respected
    tools: [get_record]
    messages: [{role: user, content: "Pull up the vendor bill with internal id 3301."}]
    expect: {tool_call: {name: get_record, args: {record_type: vendorbill, id: 3301}}}

  - id: integer_not_string
    tools: [search_jira]
    messages: [{role: user, content: "Find open bugs in project STC, at most 25 results."}]
    expect: {tool_call: {name: search_jira, args: {max_results: 25}, args_regex: {jql: "STC"}}}

  - id: optional_arg_omitted
    tools: [run_suiteql]
    messages: [{role: user, content: "Run this exactly: SELECT id FROM customer WHERE isinactive = 'F'"}]
    expect: {tool_call: {name: run_suiteql, args_regex: {query: "isinactive\\s*=\\s*'F'"}}}

  - id: quotes_and_newlines_in_arg
    tools: [run_suiteql]
    messages:
      - role: user
        content: |
          Run this query with a limit of 50:
          SELECT t.id, t.tranid
          FROM transaction t
          WHERE t.type = 'SalesOrd' AND t.memo LIKE '%"rush"%'
    expect: {tool_call: {name: run_suiteql, args: {limit: 50}, args_regex: {query: "LIKE\\s+'%\"rush\"%'"}}}

  - id: nested_object_and_array
    tools: [create_jira_issue]
    messages: [{role: user, content: "Create a Bug in STC titled 'ACK payload drops line 0'. Labels triage and hedberg. Estimate 4 hours."}]
    expect:
      tool_call: {name: create_jira_issue, args: {project: STC, issue_type: Bug}, args_regex: {summary: "ACK payload", labels: "triage.*hedberg|hedberg.*triage", estimate: "4.*h"}}

  - id: code_as_argument
    tools: [write_file]
    messages:
      - role: user
        content: |
          Write src/util/chunk.js containing a function chunk(arr, n) that splits an array into
          arrays of length n, exported with module.exports. Include a JSDoc comment with a {number} tag.
    expect: {tool_call: {name: write_file, args: {path: src/util/chunk.js}, args_regex: {content: "module\\.exports"}}}

  - id: parallel_calls
    tools: [get_record]
    messages: [{role: user, content: "Load customers 101, 102 and 103 so I can compare them. Fetch them together."}]
    expect:
      tool_calls:
        - {name: get_record, args: {record_type: customer, id: 101}}
        - {name: get_record, args: {record_type: customer, id: 102}}
        - {name: get_record, args: {record_type: customer, id: 103}}

  - id: no_call_needed
    tools: [run_suiteql, get_record, search_jira]
    messages: [{role: user, content: "In one sentence, what does a Map/Reduce script's getInputData stage do?"}]
    expect: {no_tool_call: true, content_nonempty: true}

  - id: no_call_missing_info
    tools: [get_record]
    messages: [{role: user, content: "Load that record we talked about."}]
    expect: {no_tool_call: true, content_nonempty: true}

  - id: second_step_after_result
    tools: [search_jira, create_jira_issue]
    messages:
      - {role: user, content: "Check whether STC already has a ticket about 'catalog version mismatch'. If it does not, create a Task for it."}
      - role: assistant
        content: ""
        tool_calls: [{id: call_a, type: function, function: {name: search_jira, arguments: '{"jql": "project = STC AND text ~ \"catalog version mismatch\""}'}}]
      - {role: tool, tool_call_id: call_a, content: '{"total": 0, "issues": []}'}
    expect: {tool_call: {name: create_jira_issue, args: {project: STC, issue_type: Task}, args_regex: {summary: "catalog"}}}

  - id: stop_after_result
    tools: [search_jira, create_jira_issue]
    messages:
      - {role: user, content: "Check whether STC already has a ticket about 'catalog version mismatch'. If it does not, create a Task for it."}
      - role: assistant
        content: ""
        tool_calls: [{id: call_a, type: function, function: {name: search_jira, arguments: '{"jql": "project = STC AND text ~ \"catalog version mismatch\""}'}}]
      - {role: tool, tool_call_id: call_a, content: '{"total": 1, "issues": [{"key": "STC-14102", "summary": "Catalog version mismatch on spec import"}]}'}
    expect: {no_tool_call: true, contains: ["STC-14102"]}

  - id: recover_from_tool_error
    tools: [run_suiteql]
    messages:
      - {role: user, content: "How many active customers do we have?"}
      - role: assistant
        content: ""
        tool_calls: [{id: call_q, type: function, function: {name: run_suiteql, arguments: '{"query": "SELECT COUNT(*) FROM customers WHERE isinactive = ''F''"}'}}]
      - {role: tool, tool_call_id: call_q, content: '{"error": "Invalid search: unknown table CUSTOMERS. Did you mean CUSTOMER?"}'}
    expect: {tool_call: {name: run_suiteql, args_regex: {query: "FROM\\s+customer\\b"}}}

  - id: three_step_chain_streamed
    stream: true
    tools: [read_file, write_file]
    messages:
      - {role: user, content: "Bump the version in package.json from 1.4.2 to 1.4.3."}
      - role: assistant
        content: ""
        tool_calls: [{id: call_r, type: function, function: {name: read_file, arguments: '{"path": "package.json"}'}}]
      - {role: tool, tool_call_id: call_r, content: "{\n  \"name\": \"stc-template\",\n  \"version\": \"1.4.2\",\n  \"private\": true\n}"}
    expect: {tool_call: {name: write_file, args: {path: package.json}, args_regex: {content: "\"version\":\\s*\"1\\.4\\.3\""}}}
