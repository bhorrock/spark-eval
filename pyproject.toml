[project]
name = "spark-eval"
version = "0.1.0"
description = "Gate-based acceptance tests for candidate models served by vLLM on a DGX Spark"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6", "jsonschema>=4"]

[project.scripts]
spark-eval = "spark_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spark_eval*"]
